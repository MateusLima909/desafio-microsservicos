# ==========================================
# 1. CONFIGURAÇÕES DO SERVIDOR E NOME
# ==========================================
server.port=8100
spring.application.name=product-service
server.forward-headers-strategy=framework

# ==========================================
# 2. CONEXÃO COM O BANCO DE DADOS (POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/pecstore_catalogo
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. CONFIGURAÇÕES DO HIBERNATE E CARGA DE DADOS
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==========================================
# 4. DISCOVERY SERVICE (EUREKA)
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/