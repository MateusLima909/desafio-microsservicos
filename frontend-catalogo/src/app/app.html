<div class="page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">PEC<span>Store</span></div>
    <div class="nav-actions">
      <input type="text" placeholder="Buscar produtos..." class="search">
      <button class="cart-btn" (click)="cartService.toggleCart()">
        🛒 Carrinho ({{ cartService.cartCount() }})
      </button>
    </div>
  </nav>

  <router-outlet></router-outlet>

  <footer class="footer">
    <p>&copy; 2026 PECStore. Todos os direitos reservados.</p>
  </footer>

  <div class="cart-overlay" [class.open]="cartService.isCartOpen()">
    
    <div class="backdrop" (click)="cartService.toggleCart()"></div>

    <div class="cart-sidebar">
      <div class="cart-header">
        <h2>Seu Carrinho</h2>
        <button class="close-btn" (click)="cartService.toggleCart()">✖</button>
      </div>

      <div class="cart-items">
        @for (item of cartService.cart(); track item.id) {
          <div class="cart-item">
            <img [src]="item.image" [alt]="item.name">
            <div class="item-info">
              <p>R$ {{ item.price }}</p>
              <h4>{{ item.name }}</h4>  
              <div class="quantity">
                <button>-</button>
                <span>1</span>
                <button>+</button>
              </div>
            </div>
          </div>
        }
        
        @if (cartService.cart().length === 0) {
          <p class="empty-cart">Seu carrinho está vazio no momento.</p>
        }
      </div>

      <div class="cart-footer">
        <div class="total-line">
          <span>Subtotal</span>
          <h3>R$ {{ cartService.cartTotal() }}</h3>
        </div>
        <button class="checkout-btn">Finalizar Compra</button>
      </div>
    </div>
    
  </div>

</div>
