<div class="login-overlay" [class.layout-login]="isLoginMode()" [class.layout-cadastro]="!isLoginMode()">
  
  <div class="backdrop" (click)="fechar()"></div>

  <div class="side-content">
    <h1>PEC<span>Store</span></h1>
    <p>{{ isLoginMode() ? 'Gestão de Acesso Inteligente' : 'Crie sua conta agora' }}</p>
  </div>

  <div class="form-container">
    
    @if (isLoginMode()) {
      <form (submit)="onSubmit($event)" class="form-animado">
        <button type="button" class="fechar-btn" title="Fechar" (click)="fechar()">✖</button>
        
        <h2>Login</h2>
        <hr class="hr-gradiente">

        <div class="input-group">
          <label>E-mail</label>
          <div class="input-wrapper">
            <svg class="icon-field" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" placeholder="Digite seu E-mail..." required>
          </div>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <div class="password-wrapper">
            <svg class="icon-field" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input [type]="showPassword() ? 'text' : 'password'" placeholder="Sua senha..." required>
            <button type="button" class="btn-ver-senha" (click)="togglePassword('senha')">
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Acessar</button>
        
        <p class="toggle-text">
          Não tem conta? <a href="#" (click)="toggleMode($event)">Cadastre-se</a>
        </p>
      </form>
    }

    @if (!isLoginMode()) {
      <form (submit)="onSubmit($event)" class="form-animado">
        <button type="button" class="fechar-btn" title="Fechar" (click)="fechar()">✖</button>
        
        <h2>Cadastro</h2>
        <hr class="hr-gradiente">

        <div class="input-group">
          <label>Nome Completo</label>
          <div class="input-wrapper">
            <svg class="icon-field" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" placeholder="Seu nome completo..." required>
          </div>
        </div>

        <div class="input-group">
          <label>E-mail</label>
          <div class="input-wrapper">
            <svg class="icon-field" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" placeholder="Digite seu E-mail..." required>
          </div>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <div class="password-wrapper">
            <svg class="icon-field" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input [type]="showPassword() ? 'text' : 'password'" placeholder="Sua senha..." required>
            <button type="button" class="btn-ver-senha" (click)="togglePassword('senha')">
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Cadastrar</button>
        
        <p class="toggle-text">
          Já tem conta? <a href="#" (click)="toggleMode($event)">Faça Login</a>
        </p>
      </form>
    }

  </div>
</div>
